<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ViviOR</title>
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    #unity-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; background: #000; outline: none; }
    #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
               font: 15px/1.4 Inter, system-ui, sans-serif; color: #8C8C8C; background: #000; }
    #bar { width: 280px; height: 4px; background: #1a1a1a; border-radius: 2px; overflow: hidden; }
    #fill { width: 0; height: 100%; background: linear-gradient(90deg, #0058A8, #2FA3DB); transition: width .2s; }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="loading"><span>Preparing the operating room…</span><div id="bar"><div id="fill"></div></div></div>
  <script>
    var canvas = document.querySelector("#unity-canvas");
    canvas.addEventListener("mousedown", function () { canvas.focus(); });   // keyboard input inside the website's iframe
    var buildUrl = "Build";
    var config = {
      dataUrl: buildUrl + "/sim.data",
      frameworkUrl: buildUrl + "/sim.framework.js",
      codeUrl: buildUrl + "/sim.wasm",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "HackYeah 2026",
      productName: "ViviOR",
      productVersion: "0.1",
    };
    var script = document.createElement("script");
    script.src = buildUrl + "/sim.loader.js";
    script.onload = function () {
      createUnityInstance(canvas, config, function (p) { document.querySelector("#fill").style.width = (p * 100) + "%"; })
        .then(function () { document.querySelector("#loading").remove(); canvas.focus(); })
        .catch(function (m) { document.querySelector("#loading span").textContent = m; });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
