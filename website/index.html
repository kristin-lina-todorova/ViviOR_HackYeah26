        :`<h3>${STATUS[op.status]}</h3><p class="muted" style="margin-top:8px;font-size:15px">This operation can\u2019t be started yet. The step list below shows what it will cover.</p>`}
      </aside>
    </div>
    <div class="twocol">
      <section><h2 style="margin-bottom:12px">Steps</h2>
        <ol class="steps">${op.steps.map((st,i)=>`<li${s&&i<s.furthest?' class="ok"':''}><span>${esc(st)}</span><span class="mark ${s&&i<s.furthest?'ok':'skip'}">${s&&i<s.furthest?'Reached':''}</span></li>`).join('')}</ol>
      </section>
      <div>
        <section><h2 style="margin-bottom:12px">You\u2019ll be assessed on</h2><ul class="plain">${op.objectives.map(o=>`<li>${esc(o)}</li>`).join('')}</ul></section>
        <section><h2 style="margin-bottom:12px">Instruments</h2><ul class="plain">${op.instruments.map(o=>`<li>${esc(o)}</li>`).join('')}</ul></section>
      </div>
    </div>
    ${mine.length?`<section><h2 style="margin-bottom:12px">Your attempts</h2>${attemptTable(mine,false)}</section>`:''}
  `);
  const sb=document.getElementById('sample');
  if(sb) sb.onclick=()=>{
    const r=Math.random(), done = r<.25 ? 3+Math.floor(Math.random()*7) : op.steps.length;
    const fails=[...Array(op.steps.length).keys()].map(i=>i+1).filter(i=>i<=done && Math.random()<.18);
    const a=makeAttempt(op.id, Math.random()<.35?'exam':'train', done, fails, 500+Math.floor(Math.random()*900), Date.now());
    attempts.push(a); saveAttempts(); toast('Sample attempt added'); go('attempt/'+a.id);
  };
}
function scoreRing(a){
  const done=a.stepsDone===a.stepsTotal, v=done?a.score:Math.round(a.stepsDone/a.stepsTotal*100);
  const r=22, c=2*Math.PI*r, cls=!done?'part':a.mode==='exam'?(a.score>=PASS_MARK?'pass':'fail'):'ok';
  return `<div class="ring ${cls}" aria-hidden="true"><svg viewBox="0 0 52 52"><circle class="trk" cx="26" cy="26" r="${r}"/><circle class="val" cx="26" cy="26" r="${r}" stroke-dasharray="${(v/100*c).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 26 26)"/></svg><b>${v}${done?'':'<small>%</small>'}</b></div>`;
}
function dayLabel(t){
  const d=new Date(t), today=new Date(); today.setHours(0,0,0,0); const day=new Date(d); day.setHours(0,0,0,0);
  const diff=Math.round((today-day)/86400000);
  return diff===0?'Today':diff===1?'Yesterday':d.toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'});
}
function attemptTable(list, showOp){
  let html='', lastDay='';
  list.forEach(a=>{
    const op=opById(a.opId), done=a.stepsDone===a.stepsTotal, day=dayLabel(a.date);
    if(day!==lastDay){ if(lastDay) html+='</ul>'; html+=`<h3 class="dayhead">${esc(day)}</h3><ul class="alist">`; lastDay=day; }
    const result=!done?`<span class="badge">Stopped at step ${a.stepsDone+1}</span>`:a.mode==='exam'?(a.score>=PASS_MARK?'<span class="badge pass">Exam passed</span>':'<span class="badge fail">Exam not passed</span>'):'<span class="badge ready">Completed</span>';
    const mistakes=a.steps.filter(x=>x.status==='bad').length;
    html+=`<li><a class="arow" href="#/attempt/${a.id}">
      ${scoreRing(a)}
      <div class="amain">
        <b>${showOp?esc(op.name):(a.mode==='exam'?'Exam':'Training')+' attempt'}</b>
        <div class="ameta"><span class="pill2 ${a.mode}">${a.mode==='exam'?'Exam':'Training'}</span><span>${esc(new Date(a.date).toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'}))}</span><span>${fmtTime(a.timeSec)} in theatre</span><span>${mistakes?mistakes+' step'+(mistakes>1?'s':'')+' with errors':'No errors'}</span></div>
      </div>
      <div class="aprog">${suture(a.stepsDone,a.stepsTotal)}<small>${a.stepsDone} of ${a.stepsTotal} steps</small></div>
      <div class="ares">${result}</div>
      <svg class="chev" width="10" height="16" viewBox="0 0 10 16" aria-hidden="true"><path d="M2 2l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a></li>`;
  });
  return html+'</ul>';
}

/* ---------- History ---------- */
let histMode='all';
function renderHistory(){
  const list = attempts.filter(a=>histMode==='all'||a.mode===histMode).slice().reverse();
  const done = attempts.filter(a=>a.stepsDone===a.stepsTotal);
  page('history','History',`
    <div class="pagehead"><div><h1>History</h1><p>How your scores are changing, what to practise next, and every attempt you\u2019ve made.</p></div></div>
    ${done.length?insights(done):''}
    <section class="attempts"><div class="sechead"><h2>All attempts <span class="count">${list.length}</span></h2>
      <div class="seg" role="group" aria-label="Show">${[['all','All'],['train','Training'],['exam','Exam']].map(([k,l])=>`<button data-m="${k}" aria-pressed="${histMode===k}">${l}</button>`).join('')}</div></div>
      ${list.length?attemptTable(list,true):`<div class="empty"><h3>No attempts yet</h3><p>Finish an operation in the simulator and your result appears here.</p><a class="btn secondary" href="#/operations">Choose an operation</a></div>`}</section>`);
  app.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{ histMode=b.dataset.m; renderHistory(); });
}
function insights(done){
  const first=done[0], latest=done[done.length-1], diff=latest.score-first.score;
  const exams=done.filter(a=>a.mode==='exam'), passed=exams.filter(a=>a.score>=PASS_MARK).length;
  const lost={};
  attempts.forEach(a=>a.steps.forEach((st,i)=>{ if(st.status!=='bad') return; const k=a.opId+'|'+i; (lost[k] ||= {opId:a.opId,i,pts:0,times:0}); lost[k].pts+=st.lost||0; lost[k].times++; }));
  const top=Object.values(lost).sort((a,b)=>b.pts-a.pts).slice(0,4), max=top.length?top[0].pts:1;
  return `<section class="insights">
    <div class="ins">
      <h2>Your scores</h2>
      <div class="scoreflow">
        <div><span>First attempt</span><b>${first.score}</b><small>${esc(fmtDate(first.date))}</small></div>
        <svg class="arrow" viewBox="0 0 40 16" aria-hidden="true"><path d="M2 8H36M30 2l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <div><span>Latest attempt</span><b>${latest.score}</b><small>${esc(fmtDate(latest.date))}</small></div>
      </div>
      <p class="delta ${diff>0?'up':diff<0?'down':''}">${done.length<2?'Complete another attempt to see how you\u2019re improving.':diff>0?`Up ${diff} points since your first attempt.`:diff<0?`Down ${-diff} points since your first attempt.`:'Same score as your first attempt.'}</p>
      <div class="examline"><span class="badge ${passed?'pass':exams.length?'fail':''}">${passed?'Exam passed':exams.length?'Exam not passed yet':'No exam yet'}</span>
        <span>${exams.length?`${passed} of ${exams.length} exam${exams.length>1?'s':''} passed. `:''}To pass an exam, score ${PASS_MARK} points or more out of 100.</span></div>
    </div>
    <div class="ins">
      <h2>Steps to practise</h2>
      ${top.length?`<p class="muted" style="font-size:14px;margin:4px 0 14px">The steps where you\u2019ve lost the most points across all attempts.</p>
      <ul class="lostlist">${top.map(t=>{ const op=opById(t.opId); return `<li><div class="lrow"><b>${esc(op.steps[t.i])}</b><span>\u2212${t.pts} points</span></div>
        <div class="lbar"><i style="width:${Math.max(8,Math.round(t.pts/max*100))}%"></i></div>
        <small>Step ${t.i+1} of ${esc(op.name.toLowerCase())}, wrong in ${t.times} attempt${t.times>1?'s':''}</small></li>`}).join('')}</ul>`
      :`<p class="muted" style="margin-top:8px">No mistakes recorded yet. Every step has been correct so far.</p>`}
    </div>
  </section>`;
}
function trendChart(list){
  const W=640,H=220,L=36,R=12,T=14,B=28, n=list.length;
  const x=i=> L + (n===1?0:(i/(n-1))*(W-L-R)), y=v=> T + (1-v/100)*(H-T-B);
  let g=''; [0,50,PASS_MARK,100].forEach(v=>{ g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" ${v===PASS_MARK?'stroke-dasharray="5 4" stroke="var(--iodine)"':''}/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${v}</text>`; });
  g+=`<text x="${W-R}" y="${y(PASS_MARK)-6}" text-anchor="end" font-size="11" fill="var(--iodine)">Exam pass mark</text>`;
  const pts=list.map((a,i)=>[x(i),y(a.score)]);
  g+=`<polyline fill="none" stroke="var(--muted)" stroke-width="1.5" points="${pts.map(p=>p.join(',')).join(' ')}"/>`;
  list.forEach((a,i)=>{ g+=`<circle cx="${pts[i][0]}" cy="${pts[i][1]}" r="5.5" fill="${a.mode==='exam'?'var(--iodine)':'var(--ink)'}" stroke="var(--surface)" stroke-width="2"><title>${esc(fmtDate(a.date))}: ${a.score} (${a.mode==='exam'?'exam':'training'})</title></circle>`; });
  g+=`<text x="${L}" y="${H-8}" font-size="11" fill="var(--muted)">${esc(fmtDate(list[0].date))}</text><text x="${W-R}" y="${H-8}" text-anchor="end" font-size="11" fill="var(--muted)">${esc(fmtDate(list[n-1].date))}</text>`;
  return `<div class="legend"><span><i style="background:var(--ink)"></i>Training</span><span><i style="background:var(--iodine)"></i>Exam</span><span>Completed attempts only</span></div>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Score trend across ${n} completed attempts, from ${list[0].score} to ${list[n-1].score}">${g}</svg>`;
}

/* ---------- Attempt review ---------- */
function renderAttempt(id){
  const a = attempts.find(x=>x.id===id); if(!a) return go('history');
  const op = opById(a.opId), done = a.stepsDone===a.stepsTotal, bad = a.steps.filter(s=>s.status==='bad');
  const verdict = !done ? `Stopped at step ${a.stepsDone+1} of ${a.stepsTotal}` : a.mode==='exam' ? (a.score>=PASS_MARK?'Exam passed':'Exam not passed, '+(PASS_MARK-a.score)+' points short') : 'Training completed';
  page('history','Attempt review',`
    <p style="margin-bottom:14px"><a href="#/history">History</a></p>
    <h1>${esc(op.name)}</h1>
    <p class="muted" style="margin-top:6px">${a.mode==='exam'?'Exam':'Training'} attempt, ${esc(new Date(a.date).toLocaleString(undefined,{dateStyle:'medium',timeStyle:'short'}))}</p>
    <div class="attempthead">
      <div><div class="scorebig">${done?a.score:Math.round(a.stepsDone/a.stepsTotal*100)+'%'}<small>${done?'/ 100':'done'}</small></div>
        <p style="margin-top:10px">${!done?'<span class="badge">':a.mode==='exam'?(a.score>=PASS_MARK?'<span class="badge pass">':'<span class="badge fail">'):'<span class="badge">'}${esc(verdict)}</span></p></div>
      <div class="kv"><div><span>Time</span><b>${fmtTime(a.timeSec)}</b></div><div><span>Steps done</span><b>${a.stepsDone} of ${a.stepsTotal}</b></div><div><span>Steps with errors</span><b>${bad.length}</b></div><div><span>Points lost</span><b>${done?100-a.score:bad.reduce((s,x)=>s+(x.lost||0),0)}</b></div></div>
    </div>
    <div style="max-width:720px;margin-bottom:28px">${suture(a.stepsDone,a.stepsTotal)}</div>
    <div class="twocol">
      <section><h2 style="margin-bottom:12px">Step by step</h2>
        <ol class="steps">${op.steps.map((st,i)=>{ const r=a.steps[i]||{status:'skip'}; return `<li class="${r.status}"><span>${esc(st)}${r.note?`<span class="note">${esc(r.note)}</span>`:''}</span><span class="mark ${r.status}">${r.status==='ok'?'Correct':r.status==='bad'?'\u2212'+r.lost+' points':'Not reached'}</span></li>`}).join('')}</ol>
      </section>
      <section style="margin-top:0"><h2 style="margin-bottom:12px">What to work on</h2>
        ${bad.length?`<ul class="plain">${a.steps.map((r,i)=>r.status==='bad'?`<li><b>${esc(op.steps[i])}.</b> ${esc(r.note||'')}</li>`:'').join('')}</ul>`:done?'<p>No errors on any step. Try exam mode, or aim for a faster time.</p>':'<p>No errors so far. Finish the remaining steps to get a full score.</p>'}
        <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:20px">${startBtn(op.id,a.mode,done?'Try again':'Resume')}${a.mode==='train'&&done&&a.score>=PASS_MARK?startBtn(op.id,'exam','Take the exam','secondary'):''}</div>
      </section>
    </div>`);
}

/* ---------- Result handoff from the simulator ---------- */
function handleResult(p){
  const op = opById(p.get('op')||'');
  if(!op){ toast('The simulator sent a result for an unknown operation'); return go('dashboard'); }
  const a = recordResult(op.id, p.get('mode'), { steps:p.get('steps'), fails:p.get('fails'), time:p.get('time'), score:p.get('score') });
  toast('Result saved'); location.replace('#/attempt/'+a.id);
}

/* ---------- Profile ---------- */
function renderProfile(anchor){
  const theme = LS.get('vor.theme','system');
  const base = location.href.split('#')[0];
  page('profile','Profile',`
    <div class="pagehead"><div><h1>Profile</h1><p>Your account and display settings.</p></div><button class="btn secondary" id="signout">Sign out</button></div>
    <div class="panel account">
      <div class="acchead"><div class="bigavatar" aria-hidden="true">${esc(initials(user.name))}</div><div><b>${esc(user.name)}</b><span>${esc(user.email)}</span></div></div>
      <form class="accsec" id="pform" novalidate>
        <div class="secinfo"><h2>Your details</h2><p class="muted">Shown on your dashboard.</p></div>
        <div>
          <div class="formgrid">
            <label class="field"><span>Full name</span><input type="text" id="pName" value="${esc(user.name)}"></label>
            <label class="field"><span>Email</span><input type="email" value="${esc(user.email)}" disabled></label>
            <label class="field"><span>I am a</span><select id="pRole">${['Medical student','Resident','Surgeon or instructor','Other'].map(r=>`<option${r===user.role?' selected':''}>${r}</option>`).join('')}</select></label>
            <label class="field"><span>University or hospital</span><input type="text" id="pOrg" value="${esc(user.org||'')}"></label>
          </div>
          <button class="btn" type="submit">Save details</button>
        </div>
      </form>
      <div class="accsec">
        <div class="secinfo"><h2>Appearance</h2><p class="muted">Match your device or pick a theme.</p></div>
        <div class="secact"><div class="seg" role="group" aria-label="Theme">${[['system','Device'],['light','Light'],['dark','Dark']].map(([k,l])=>`<button data-t="${k}" aria-pressed="${theme===k}">${l}</button>`).join('')}</div></div>
      </div>
      <div class="accsec">
        <div class="secinfo"><h2>Progress data</h2><p class="muted">${attempts.length} attempt${attempts.length===1?'':'s'} saved in this browser.</p></div>
        <div class="secact"><button class="btn danger" id="reset">Delete all attempts</button></div>
      </div>
    </div>
`);
  document.getElementById('signout').onclick=()=>{ LS.del('vor.session'); location.hash='#/signin'; };
  document.getElementById('pform').onsubmit=e=>{ e.preventDefault(); const n=document.getElementById('pName').value.trim(); if(!n){ toast('Enter your full name'); return; } user.name=n; user.role=document.getElementById('pRole').value; user.org=document.getElementById('pOrg').value.trim(); saveUser(); toast('Details saved'); renderProfile(); };
  app.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{ LS.set('vor.theme',b.dataset.t); applyTheme(); app.querySelectorAll('[data-t]').forEach(x=>x.setAttribute('aria-pressed',x===b)); });
  const rb=document.getElementById('reset'); rb.onclick=()=>{ if(rb.dataset.armed){ attempts=[]; saveAttempts(); toast('All attempts deleted'); renderProfile(); } else { rb.dataset.armed='1'; rb.textContent='Select again to delete '+attempts.length+' attempts'; setTimeout(()=>{ if(document.body.contains(rb)){ delete rb.dataset.armed; rb.textContent='Delete all attempts'; } },5000); } };
}

route();
</script>
</body>
